spring:
  datasource:
    url: jdbc:h2:mem:pocketkit-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    secret: pocketkit-test-jwt-secret-key-at-least-32-bytes-long-2026
    expiration-ms: 3600000
