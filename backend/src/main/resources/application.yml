server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  application:
    name: pocketkit-backend
  datasource:
    url: jdbc:h2:file:./data/pocketkit-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:pocketkit-dev-jwt-secret-key-please-override-in-prod-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
