server.address=0.0.0.0
server.port=${PORT:8080}

spring.application.name=pocketkit-backend

spring.datasource.url=jdbc:h2:file:./data/pocketkit-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secret=${JWT_SECRET:pocketkit-dev-jwt-secret-key-please-override-in-prod-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
